function logoPDF(doc,x,y,s){
  const k=s/1024;
  doc.setFillColor(11,84,62); doc.roundedRect(x,y,s,s,230*k,230*k,"F");
  doc.setFillColor(242,244,241); doc.roundedRect(x+300*k,y+210*k,130*k,604*k,65*k,65*k,"F");
  doc.setDrawColor(242,244,241); doc.setLineWidth(130*k); doc.setLineCap("round"); doc.line(x+470*k,y+600*k,x+700*k,y+800*k);
  doc.setFillColor(242,193,78); doc.circle(x+640*k,y+400*k,128*k,"F");
  doc.setDrawColor(217,164,44); doc.setLineWidth(18*k); doc.circle(x+640*k,y+400*k,84*k,"S");
  doc.setLineCap("butt");
}
async function gerarPDF(ini,fim){
  await carregarLib(LIB.jspdf); await carregarLib(LIB.autotable);
  const { jsPDF } = window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const W=210, M=14, verde=[14,106,78], tinta=[21,32,27], cinza=[94,107,100], linha=[214,220,213], pos=[14,122,79], neg=[184,58,38];
  const itens=state.items.filter(i=>{ const k=ym(i.vencimento); return k>=ini && k<=fim; }).sort((a,b)=>a.vencimento.localeCompare(b.vencimento)||ordemOf(a)-ordemOf(b));
  const periodo = ini===fim? nomeMes(ini) : `${nomeMes(ini)} a ${nomeMes(fim)}`;
  const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
  const money = v => fmt(v).replace(/ /g," ");

  doc.setFillColor(...verde); doc.rect(0,0,W,32,"F");
  logoPDF(doc,M,8,16);
  doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(20); doc.text("Keepy",M+21,17);
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.text("Relatório financeiro"+(nomeExibido()?" de "+nomeExibido():""),M+21,23);
  doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.text(cap(periodo),W-M,17,{align:"right"});
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.text("Gerado em "+dataBR(todayStr()),W-M,23,{align:"right"});

  const caixa=caixaHoje(), inv=reservaHoje();
  const prevFim = caixa + somar(state.items,"receita",i=>!i.pago && ym(i.vencimento)<=fim) - somar(state.items,"despesa",i=>!i.pago && ym(dataCaixa(i))<=fim);
  const kpis=[["Meus recursos hoje",caixa+inv],["Saldo em caixa hoje",caixa],["Em investimento hoje",inv],["Caixa previsto em "+nomeMes(fim).split(" de ")[0],prevFim]];
  let y=40; const bw=(W-2*M-3*4)/4;
  kpis.forEach(([t,v],i)=>{
    const x=M+i*(bw+4);
    doc.setDrawColor(...linha); doc.setLineWidth(0.3); doc.roundedRect(x,y,bw,20,2,2,"S");
    doc.setTextColor(...cinza); doc.setFontSize(7.5); doc.setFont("helvetica","bold"); doc.text(t.toUpperCase(),x+3,y+6,{maxWidth:bw-6});
    doc.setTextColor(...(v<0?neg:tinta)); doc.setFontSize(12); doc.text(money(v),x+3,y+15);
  });
  y+=30;

  const r=resumoDe(itens);
  const corpo=[[{content:"Entradas",styles:{fontStyle:"bold"}},{content:money(r.tr),styles:{fontStyle:"bold",textColor:pos}}],
    ...r.R.map(([c,v])=>["    "+c,money(v)]),
    [{content:"Gastos",styles:{fontStyle:"bold"}},{content:money(-r.gastos),styles:{fontStyle:"bold",textColor:neg}}],
    ...r.G.map(([c,v])=>["    "+c,money(-v)]),
    ["Aplicado em investimentos",money(-r.aplic)],
    ...(r.resg? [["Resgatado de investimentos",money(r.resg)]] : []),
    [{content:"Sobra do período no caixa",styles:{fontStyle:"bold"}},{content:money(r.sobra),styles:{fontStyle:"bold",textColor:r.sobra<0?neg:pos}}]];
  doc.setTextColor(...tinta); doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.text("Resumo do período",M,y);
  doc.autoTable({startY:y+3, margin:{left:M,right:M}, body:corpo, theme:"plain",
    styles:{fontSize:9.5, cellPadding:{top:1.6,bottom:1.6,left:2,right:2}, textColor:tinta, lineColor:linha, lineWidth:{bottom:0.2}},
    columnStyles:{1:{halign:"right",cellWidth:45}}});
  y=doc.lastAutoTable.finalY+10;

  if(ini!==fim){
    const meses=[]; let k=ini; while(k<=fim){ meses.push(k); k=addMonths(k,1); }
    doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.text("Mês a mês",M,y);
    doc.autoTable({startY:y+3, margin:{left:M,right:M}, theme:"plain",
      head:[["Mês","Entradas","Gastos","Investido (líquido)","Sobra"]],
      body:meses.map(k=>{ const x=resumoDe(itens.filter(i=>ym(i.vencimento)===k)); return [cap(nomeMes(k)),money(x.tr),money(-x.gastos),money(-x.inv),money(x.sobra)]; }),
      styles:{fontSize:9, cellPadding:1.8, textColor:tinta, lineColor:linha, lineWidth:{bottom:0.2}},
      headStyles:{fontStyle:"bold", textColor:cinza, fontSize:8},
      columnStyles:{1:{halign:"right"},2:{halign:"right"},3:{halign:"right"},4:{halign:"right"}}});
    y=doc.lastAutoTable.finalY+10;
  }

  doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(...tinta); doc.text(`Lançamentos (${itens.length})`,M,y);
  doc.autoTable({startY:y+3, margin:{left:M,right:M,bottom:16}, theme:"plain",
    head:[["Data","Descrição","Categoria","Pagamento","Valor","Situação"]],
    body: itens.length? itens.map(i=>[dataBR(i.vencimento), i.descricao, i.categoria, meioNome(i.meio)||"", (i.tipo==="receita"?"+ ":"- ")+money(i.valor), i.pago?(i.tipo==="receita"?"Recebido":"Pago"):"Em aberto"]) : [[{content:"Nenhum lançamento no período.",colSpan:6,styles:{textColor:cinza}}]],
    styles:{fontSize:8.5, cellPadding:1.6, textColor:tinta, lineColor:linha, lineWidth:{bottom:0.2}, overflow:"linebreak"},
    headStyles:{fontStyle:"bold", textColor:cinza, fontSize:7.5},
    columnStyles:{0:{cellWidth:20},2:{cellWidth:30},3:{cellWidth:32},4:{halign:"right",cellWidth:27},5:{cellWidth:18}},
    didParseCell:d=>{ if(d.section==="body" && d.column.index===4 && itens[d.row.index]) d.cell.styles.textColor = itens[d.row.index].tipo==="receita"? pos : neg; }});

  const n=doc.internal.getNumberOfPages();
  for(let p=1;p<=n;p++){
    doc.setPage(p); doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...cinza);
    doc.text("Keepy · "+cap(periodo),M,290); doc.text(`Página ${p} de ${n}`,W-M,290,{align:"right"});
  }
  return doc.output("blob");
}

/* ---------- fechar o mês + relatório por e-mail ---------- */
// O administrador fecha cada mês que terminou. Mês fechado não aceita lançamentos nem mudanças.
// Só meses fechados têm o PDF enviado para o e-mail da conta; só depois de enviado o mês pode sair do histórico.
const fechadoAte = () => /^\d{4}-\d{2}$/.test(state.cfg.fechadoAte||"")? state.cfg.fechadoAte : "";
const mesFechado = k => !!fechadoAte() && k<=fechadoAte();
const itemFechado = i => !!i && !!i.vencimento && mesFechado(ym(i.vencimento));
const tituloBackup = k => { const nm=nomeMes(k); return `Keepy – ${nm.charAt(0).toUpperCase()+nm.slice(1)}.pdf`; };
const msgFechado = k => `${cap1(nomeMes(k))} está fechado. ${state.admin? "Reabra o mês em Lançamentos para alterar." : "Só o administrador pode reabrir."}`;
const cap1 = t => t.charAt(0).toUpperCase()+t.slice(1);
// Próximo mês que já terminou e ainda não foi fechado (o mais antigo primeiro).
function proximoAFechar(){
  if(!state.admin) return null;
  const ultimo=addMonths(ym(todayStr()),-1);
  const meses=[...new Set(state.items.map(i=>ym(i.vencimento)))].sort();
  const k = meses.find(m=>(!fechadoAte() || m>fechadoAte()));
  return k && k<=ultimo? k : null;
}
async function salvarCfg(extra){ state.cfg={...state.cfg, ...extra}; await docG().set(state.cfg); }
async function fecharMes(k, btn){
  if(!btn.dataset.armed){ btn.dataset.armed="1"; btn.classList.add("danger","armed"); btn.textContent=`Confirmar: fechar ${nomeMes(k).split(" de ")[0]}`; return; }
  btn.disabled=true; btn.textContent="Fechando…";
  try{
    await salvarCfg({fechadoAte:k});
    toast(`${cap1(nomeMes(k))} fechado`);
    render(); enviarPendentes();
  }catch(e){ toast("Não foi possível fechar o mês agora. Verifique a conexão."); btn.disabled=false; }
}
async function reabrirMes(btn){
  const k=fechadoAte(); if(!k) return;
  if(!btn.dataset.armed){ btn.dataset.armed="1"; btn.classList.add("danger","armed"); btn.textContent=`Confirmar: reabrir ${nomeMes(k).split(" de ")[0]}`; return; }
  btn.disabled=true;
  try{
    const ant=addMonths(k,-1), extra={fechadoAte: state.items.some(i=>ym(i.vencimento)<=ant)? ant : ""};
    if(state.cfg.backupAte && state.cfg.backupAte>=k) extra.backupAte = ant;
    await salvarCfg(extra); toast(`${cap1(nomeMes(k))} reaberto. Ao fechar de novo, o relatório é reenviado.`); render();
  }catch(e){ toast("Não foi possível reabrir agora."); btn.disabled=false; }
}
function bannerFechar(k, ondeLanc){
  if(!k) return "";
  const mes=nomeMes(k).split(" de ")[0];
  return `<div class="banner fechar"><span><b>${cap1(mes)} terminou.</b> Confira os lançamentos e feche o mês. Depois de fechado, ninguém mais altera ${mes}${state.cfg.backupEmail?` e o relatório em PDF vai para ${esc(state.me&&state.me.email||"o seu e-mail")}`:""}.</span>${ondeLanc||state.month===k? "" : `<button class="btn sm" data-vermes="${k}">Ver ${mes}</button>`}<button class="btn primary sm" data-fecharmes="${k}">Fechar ${mes}</button></div>`;
}
function bannerFechado(k){
  if(!mesFechado(k)) return "";
  const enviado = state.cfg.backupAte && k<=state.cfg.backupAte;
  const podeReabrir = state.admin && k===fechadoAte();
  return `<div class="banner fechado"><span>🔒 <b>${cap1(nomeMes(k))} está fechado.</b> ${state.cfg.backupEmail? (enviado? "Relatório enviado por e-mail." : "Relatório aguardando envio por e-mail.") : "Não aceita novos lançamentos nem mudanças."}</span>${podeReabrir? `<button class="btn sm" data-reabrir="1">Reabrir</button>` : ""}</div>`;
}
let enviando=false;
async function enviarPendentes(){
  if(!state.cfg.backupEmail || state.readOnly || enviando || !fechadoAte()) return;
  enviando=true; const feitos=[];
  try{
    const meses=[...new Set(state.items.map(i=>ym(i.vencimento)))].sort();
    let k = /^\d{4}-\d{2}$/.test(state.cfg.backupAte||"")? addMonths(state.cfg.backupAte,1) : meses[0];
    while(k && k<=fechadoAte()){
      if(state.items.some(i=>ym(i.vencimento)===k)){
        const pdf=await blobB64(await gerarPDF(k,k));
        const {data, error} = await sb.functions.invoke("enviar-relatorio", {body:{titulo:tituloBackup(k), periodo:nomeMes(k), pdf}});
        if(error){ let det={}; try{ det=await error.context.json(); }catch(_){ } throw {code: det.erro||"envio"}; }
        feitos.push(k);
      }
      await salvarCfg({backupAte:k});
      k=addMonths(k,1);
    }
  }catch(e){
    const c=e&&e.code;
    toast(c==="sem_chave"? "O envio de e-mail ainda não está configurado. O relatório fica guardado para enviar depois." : "Não consegui enviar o relatório por e-mail agora. Tento de novo na próxima vez que você abrir.");
  }
  enviando=false;

// Mesmo formato de antes: documentos de configuração (geral, categorias, meios) e lançamentos.
// Tudo fica na tabela docs, protegida por usuário; o app mantém uma cópia em memória e sincroniza em tempo real.
const novoId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,10);
function criarStore(uid){
  const cfg=new Map(), lanc=new Map(), subsL=[], subsC={};
  const emitL=()=>{ const docs=[...lanc].map(([id,d])=>({id, data:()=>d})); subsL.forEach(cb=>cb({docs})); };
  const emitC=id=>(subsC[id]||[]).forEach(cb=>{ const d=cfg.get(id); cb(d? {exists:true, data:()=>d} : {exists:false}); });
  const geral=()=>cfg.get("geral")||{};
  const fech=()=>{ const f=geral().fechadoAte; return /^\d{4}-\d{2}$/.test(f||"")? f : ""; };
  const trava=(antes,depois,apagando)=>{
    const f=fech(); if(!f) return;
    const mA=antes&&antes.vencimento? antes.vencimento.slice(0,7) : null, mD=depois&&depois.vencimento? depois.vencimento.slice(0,7) : null;
    if(apagando){ const bk=geral().backupAte||""; if(mA && mA<=f && !(bk && mA<=bk)) throw {code:"mes_fechado"}; return; }
    if((mA && mA<=f) || (mD && mD<=f)) throw {code:"mes_fechado"};
  };
  const grava=async(col,id,data)=>{ const {error}=await sb.from("docs").upsert({user_id:uid, colecao:col, id, data, updated_at:new Date().toISOString()}); if(error) throw error; };
  const apaga=async(col,id)=>{ const {error}=await sb.from("docs").delete().eq("user_id",uid).eq("colecao",col).eq("id",id); if(error) throw error; };
  const docLanc=id=>({ id,
    set: async d=>{ trava(lanc.get(id),d); const v=JSON.parse(JSON.stringify(d)), ant=lanc.get(id); lanc.set(id,v); emitL(); try{ await grava("lanc",id,v); }catch(e){ ant? lanc.set(id,ant) : lanc.delete(id); emitL(); throw e; } },
    update: async u=>{ const ant=lanc.get(id); if(!ant) throw {code:"not_found"}; const v=JSON.parse(JSON.stringify({...ant,...u})); trava(ant,v); lanc.set(id,v); emitL(); try{ await grava("lanc",id,v); }catch(e){ lanc.set(id,ant); emitL(); throw e; } },
    delete: async()=>{ const ant=lanc.get(id); trava(ant,null,true); lanc.delete(id); emitL(); try{ await apaga("lanc",id); }catch(e){ if(ant){ lanc.set(id,ant); emitL(); } throw e; } },
  });
  const colAPI={
    onSnapshot:(cb)=>{ subsL.push(cb); return ()=>{}; },
    doc:(id)=>docLanc(id||novoId()),
    add:async d=>{ const r=docLanc(novoId()); await r.set(d); return r; },
  };
  const docCfg=id=>({
    onSnapshot:(cb)=>{ (subsC[id]=subsC[id]||[]).push(cb); return ()=>{}; },
    set: async d=>{ const v=JSON.parse(JSON.stringify(d)), ant=cfg.get(id); cfg.set(id,v); emitC(id); try{ await grava("cfg",id,v); }catch(e){ ant? cfg.set(id,ant) : cfg.delete(id); emitC(id); throw e; } },
  });
  const api={ doc:p=>{ const k=p.split("/").pop(); return k==="conta"? {collection:()=>colAPI} : docCfg(k); } };
  api.carregar=async()=>{
    for(let de=0;;de+=1000){
      const {data,error}=await sb.from("docs").select("colecao,id,data").order("colecao").order("id").range(de,de+999);
      if(error) throw error;
      for(const r of data){ (r.colecao==="lanc"? lanc : cfg).set(r.id, r.data); }
      if(data.length<1000) break;
    }
    emitL(); ["geral","categorias","meios"].forEach(emitC);
    // Mudanças feitas em outro aparelho chegam em tempo real.
    sb.channel("docs-"+uid).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"user_id=eq."+uid},p=>{
      const r=p.new&&p.new.id? p.new : p.old; if(!r||!r.colecao) return;
      const m=r.colecao==="lanc"? lanc : cfg;
      if(p.eventType==="DELETE"){ if(!m.has(r.id)) return; m.delete(r.id); }
      else { if(JSON.stringify(m.get(r.id))===JSON.stringify(p.new.data)) return; m.set(r.id,p.new.data); }
      r.colecao==="lanc"? emitL() : emitC(r.id);
    }).subscribe();
  };
  api.importar=async(lista)=>{
    for(let i=0;i<lista.length;i+=200){
      const lote=lista.slice(i,i+200).map(x=>({user_id:uid, colecao:x.colecao, id:x.id, data:x.data, updated_at:new Date().toISOString()}));
      const {error}=await sb.from("docs").upsert(lote); if(error) throw error;
      lote.forEach(x=>(x.colecao==="lanc"? lanc : cfg).set(x.id,x.data));
    }
    emitL(); ["geral","categorias","meios"].forEach(emitC);
  };
  return api;
}

async function importarBackup(file){
  const er=$("bkErr"); er.hidden=true;
  let etapa="ler";
  try{
    const txt=await file.text(); etapa="formato";
    const j=JSON.parse(txt.replace(/^\uFEFF/,""));
    if(!j || j.app!=="keepy" || !Array.isArray(j.docs)) throw 0;
    etapa="salvar";
    const lista=j.docs.filter(x=>x && (x.colecao==="lanc"||x.colecao==="cfg") && typeof x.id==="string" && x.data && typeof x.data==="object");
    if(!lista.length) throw 0;
    const f=fechadoAte(); if(f && lista.some(x=>x.colecao==="lanc" && x.data.vencimento && x.data.vencimento.slice(0,7)<=f)){ er.textContent="O arquivo tem lançamentos de meses já fechados. Reabra esses meses antes de trazer os dados."; er.hidden=false; return; }
    // Mantém as travas de fechamento e envio já existentes na versão nova.
    lista.forEach(x=>{ if(x.colecao==="cfg" && x.id==="geral"){ const {fechadoAte,backupAte,backupEmail}=state.cfg; x.data={...x.data}; ["fechadoAte","backupAte","backupEmail"].forEach(k=>delete x.data[k]); Object.assign(x.data, JSON.parse(JSON.stringify({fechadoAte,backupAte,backupEmail}))); } });
    const bt=$("btnBackup"); if(bt){ bt.disabled=true; bt.textContent="Trazendo dados…"; }
    await state.db.importar(lista);
    const n=lista.filter(x=>x.colecao==="lanc").length;
    toast(`${n} ${n===1?"lançamento trazido":"lançamentos trazidos"} do Keepy antigo`); render();
  }catch(e){
    er.textContent = etapa==="salvar"? `Li o arquivo, mas não consegui salvar os dados (${(e&&e.message)||"erro de conexão"}). Tente de novo.` : etapa==="formato"? `O arquivo “${file.name}” não é o arquivo de dados do Keepy antigo. Ele se chama keepy-dados.json.` : "Não consegui abrir esse arquivo. Tente escolher de novo.";
    er.hidden=false;
  }
}
document.addEventListener("change",e=>{ if(e.target.id==="fBackup" && e.target.files[0]){ importarBackup(e.target.files[0]); e.target.value=""; } });

async function iniciar(user){
  state.auth="ok"; state.uid=user.id; state.base="u/"+user.id;
  state.me={name:(user.user_metadata&&user.user_metadata.nome)||"", email:user.email};
  state.trocarSenha = state.trocarSenha || !!(user.user_metadata&&user.user_metadata.trocar_senha);
  const db=criarStore(user.id); state.db=db; render();
  colL().onSnapshot(snap=>{
    state.items = snap.docs.map(d=>({id:d.id,...d.data()})).filter(i=>i.vencimento&&typeof i.valor==="number");
    state.loaded=true; itensOk=true; render(); limpezaAutomatica(); recorrenciaAutomatica();
  });
  docG().onSnapshot(s=>{ state.cfg = s.exists? s.data() : {saldoInicial:0}; cfgOk=true; if(state.loaded) render(); limpezaAutomatica(); recorrenciaAutomatica(); });
  docC().onSnapshot(s=>{ state.catCfg = s.exists? s.data() : null; if(state.loaded) render(); });
  docM().onSnapshot(s=>{ state.meiosCfg = s.exists? s.data() : null; if(state.loaded) render(); });
  try{ const {data}=await sb.from("admins").select("user_id").eq("user_id",user.id).maybeSingle(); state.admin=!!data; }catch(_){ state.admin=false; }
  try{ await db.carregar(); }catch(e){ state.db=null; state.loaded=true; render(); }
}

<div id="ptr" aria-hidden="true"><span class="ptr-ico">↻</span></div>
<style>
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:40;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:var(--surface);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;transform:translateY(-70px);opacity:0;pointer-events:none;color:var(--accent);font-size:22px;font-weight:700}
#ptr.pronto .ptr-ico{color:var(--accent)}
#ptr.girando .ptr-ico{animation:ptrgira .8s linear infinite}
@keyframes ptrgira{to{transform:rotate(360deg)}}
</style>
<script>
// Puxar para baixo para atualizar (o app na tela de início do iPhone não tem isso sozinho).
(function(){
  const el=document.getElementById("ptr"), ico=el.querySelector(".ptr-ico"), LIM=80;
  let y0=null, dy=0, ativo=false;
  const topo=()=> (window.scrollY||document.documentElement.scrollTop)<=0;
  const bloqueado=t=> !!(t.closest && t.closest(".sheet-bg,input,textarea,select,.sheet"));
  document.addEventListener("touchstart",e=>{ if(e.touches.length!==1 || !topo() || bloqueado(e.target)){ y0=null; return; } y0=e.touches[0].clientY; dy=0; ativo=false; },{passive:true});
  document.addEventListener("touchmove",e=>{
    if(y0===null) return;
    dy=e.touches[0].clientY-y0;
    if(dy<=0 || !topo()){ el.style.opacity=0; el.style.transform="translateY(-70px)"; ativo=false; return; }
    ativo=true;
    const d=Math.min(dy*0.5, LIM+20);
    el.style.transition="none"; el.style.opacity=Math.min(1,d/LIM); el.style.transform=`translateY(${d-50}px)`;
    ico.style.transform=`rotate(${d*4}deg)`; el.classList.toggle("pronto", d>=LIM);
  },{passive:true});
  document.addEventListener("touchend",()=>{
    if(y0===null) return; y0=null;
    const d=Math.min(dy*0.5, LIM+20);
    el.style.transition="transform .2s, opacity .2s";
    if(ativo && d>=LIM){ el.style.transform="translateY(20px)"; ico.style.transform=""; el.classList.add("girando"); setTimeout(()=>location.reload(),250); }
    else { el.style.opacity=0; el.style.transform="translateY(-70px)"; }
    ativo=false;
  });
})();
</script>
